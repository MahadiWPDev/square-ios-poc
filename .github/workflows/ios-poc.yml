name: iOS PoC CI

# Fixed pipeline (Phase 1).
#
# Job order is explicit: build-app declares `needs: rust-ios`, so the
# app is never built before the Rust framework exists.
#
# rust-ios builds the square-core-poc crate for the iOS device and
# simulator targets, packages SquareCorePOC.xcframework (with a Swift
# module map in each slice), zips it, and uploads ONE artifact named
# squarepoc-phase0-rust containing the ZIP and the Rust logs. This job
# has no continue-on-error: if the framework build, packaging or
# upload fails, the job fails and build-app does not run. The
# upstream Square Rust core cargo check stays as a clearly labelled
# diagnostic experiment inside this job; its result is recorded in
# its log and never gates anything.
#
# build-app downloads squarepoc-phase0-rust, extracts the ZIP into
# SquarePoC/Frameworks/ (the exact location the Xcode project
# references), verifies both platform slices, their libraries,
# headers and module maps, then builds the app, runs the XCTest
# suite, installs and launches the app in a simulator, takes a
# screenshot, and publishes the single pre-release for this run
# (poc-build-<run number>) with the app ZIP, the XCFramework ZIP,
# all logs and the screenshot. Only this job touches the release,
# so the two jobs cannot race on the same tag.
#
# build-device is a third, independent validation job (also needs
# rust-ios only): it builds the app and the test target for a
# GENERIC iOS DEVICE destination with signing fully disabled, and
# checks the produced device app (arm64 binary, UIBackgroundModes).
# It proves the project compiles and links for a real iPhone, but
# its output is UNSIGNED and NOT installable: installing on a
# physical iPhone happens in Xcode on a Mac with the owner's own
# Apple Account (Personal Team free provisioning).
#
# Nothing here signs with a real identity, nothing is uploaded to
# TestFlight or the App Store, and no paid runner or service is used.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rust-ios:
    name: Rust iOS build and XCFramework
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Check out the original Square repository at the audited commit
        uses: actions/checkout@v4
        with:
          repository: Lelonio/Square
          ref: a64b9ee053bdba03398b2f31d65bccc976046612
          path: upstream-square

      - name: Install the Rust toolchain with iOS targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Build the square-core-poc crate for iOS and run its tests
        run: |
          set -o pipefail
          cd rust-poc
          cargo test 2>&1 | tee ../rust-poc-test.log
          cargo build --release --target aarch64-apple-ios 2>&1 | tee ../rust-poc-ios.log
          cargo build --release --target aarch64-apple-ios-sim 2>&1 | tee -a ../rust-poc-ios.log
          ls -lh target/aarch64-apple-ios/release/libsquare_core_poc.a target/aarch64-apple-ios-sim/release/libsquare_core_poc.a
          cd ..

      - name: Package the poc libraries as an XCFramework with a Swift module map
        run: |
          set -e
          xcodebuild -create-xcframework \
            -library rust-poc/target/aarch64-apple-ios/release/libsquare_core_poc.a \
            -headers rust-poc/include \
            -library rust-poc/target/aarch64-apple-ios-sim/release/libsquare_core_poc.a \
            -headers rust-poc/include \
            -output SquareCorePOC.xcframework
          for slice in SquareCorePOC.xcframework/*/; do
            if [ -d "${slice}Headers" ]; then
              printf 'module SquareCorePOC {\n  header "square_core_poc.h"\n  export *\n}\n' > "${slice}Headers/module.modulemap"
              echo "module map written to ${slice}Headers/module.modulemap"
            fi
          done
          test -d SquareCorePOC.xcframework/ios-arm64
          test -d SquareCorePOC.xcframework/ios-arm64-simulator
          find SquareCorePOC.xcframework -type f | sort
          ditto -c -k --keepParent SquareCorePOC.xcframework SquareCorePOC.xcframework.zip
          unzip -l SquareCorePOC.xcframework.zip
          ls -lh SquareCorePOC.xcframework.zip

      - name: Diagnostic experiment, typecheck the original Rust core for iOS (never a gate)
        run: |
          # Intentionally diagnostic only: the original project's
          # Rust core is not a dependency of the app. Its exit status
          # is recorded in the log file and in the step summary, and
          # this step always succeeds so it can never mask or block
          # the required square-core-poc build above.
          cd upstream-square/native
          set +e
          cargo check --target aarch64-apple-ios > ../../upstream-native-ios-check.log 2>&1
          STATUS=$?
          set -e
          echo "upstream cargo check exit status: $STATUS" | tee -a ../../upstream-native-ios-check.log
          echo "## Diagnostic only: upstream Rust core cargo check for aarch64-apple-ios" >> "$GITHUB_STEP_SUMMARY"
          echo "Exit status: $STATUS (not a gate; full log in the artifacts)" >> "$GITHUB_STEP_SUMMARY"
          tail -30 ../../upstream-native-ios-check.log

      - name: Upload the XCFramework ZIP and Rust logs as one artifact
        uses: actions/upload-artifact@v4
        with:
          name: squarepoc-phase0-rust
          path: |
            SquareCorePOC.xcframework.zip
            rust-poc-ios.log
            rust-poc-test.log
            upstream-native-ios-check.log
          retention-days: 30
          if-no-files-found: error

  build-app:
    name: Build, test and run the app in a simulator
    needs: rust-ios
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Download the Rust artifact
        uses: actions/download-artifact@v4
        with:
          name: squarepoc-phase0-rust
          path: rust-artifacts

      - name: Extract the XCFramework into the location the Xcode project expects
        run: |
          set -e
          ls -lh rust-artifacts/
          test -f rust-artifacts/SquareCorePOC.xcframework.zip
          mkdir -p SquarePoC/Frameworks
          rm -rf SquarePoC/Frameworks/SquareCorePOC.xcframework
          unzip -o rust-artifacts/SquareCorePOC.xcframework.zip -d SquarePoC/Frameworks
          FW="SquarePoC/Frameworks/SquareCorePOC.xcframework"
          test -d "$FW"
          echo "Framework extracted to $FW"
          find "$FW" -type f | sort

      - name: Verify the XCFramework slices, libraries, headers and module maps
        run: |
          set -e
          FW="SquarePoC/Frameworks/SquareCorePOC.xcframework"
          for slice in ios-arm64 ios-arm64-simulator; do
            test -d "$FW/$slice"
            test -f "$FW/$slice/libsquare_core_poc.a"
            test -f "$FW/$slice/Headers/square_core_poc.h"
            test -f "$FW/$slice/Headers/module.modulemap"
            echo "slice OK: $slice"
          done
          test -f "$FW/Info.plist"
          echo "XCFramework structure verified: both slices present with library, header and module map."

      - name: Show the toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          ls /Applications | grep -i xcode || true

      - name: Pick an available iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data['devices'].items():
              if 'iOS' not in runtime:
                  continue
              for d in devices:
                  if d.get('isAvailable') and 'iPhone' in d['name']:
                      print(d['udid'])
                      sys.exit(0)
          sys.exit(1)
          ")
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          echo "Selected simulator: $UDID"
          xcrun simctl list devices available | grep -A2 -i iphone | head -20

      - name: Build the app for the simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project SquarePoC.xcodeproj \
            -scheme SquarePoC \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build-app.log
          echo "## App build result" >> "$GITHUB_STEP_SUMMARY"
          echo "xcodebuild build exit status: ${PIPESTATUS[0]}" >> "$GITHUB_STEP_SUMMARY"

      - name: Run the automated tests in the simulator
        run: |
          set -o pipefail
          xcodebuild test \
            -project SquarePoC.xcodeproj \
            -scheme SquarePoC \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee test.log
          echo "## Test result" >> "$GITHUB_STEP_SUMMARY"
          echo "xcodebuild test exit status: ${PIPESTATUS[0]}" >> "$GITHUB_STEP_SUMMARY"
          grep -E "Test Suite 'SquarePoCTests'|Executed .* tests" test.log | tail -5 >> "$GITHUB_STEP_SUMMARY" || true

      - name: Install, launch and screenshot in the simulator
        run: |
          set -e
          APP_PATH="build/DerivedData/Build/Products/Debug-iphonesimulator/SquarePoC.app"
          test -d "$APP_PATH"
          # simctl boot returns an error when the device is already
          # booted; that case is expected and intentionally ignored.
          xcrun simctl boot "$SIM_UDID" || true
          xcrun simctl bootstatus "$SIM_UDID" -b
          xcrun simctl install "$SIM_UDID" "$APP_PATH"
          xcrun simctl launch "$SIM_UDID" dev.mahadi.squarepoc
          sleep 4
          xcrun simctl io "$SIM_UDID" screenshot simulator-screenshot.png
          # Terminating is best effort cleanup only; the app may
          # already have exited, which is not a failure.
          xcrun simctl terminate "$SIM_UDID" dev.mahadi.squarepoc || true
          echo "Simulator install and launch completed." >> "$GITHUB_STEP_SUMMARY"

      - name: Package the simulator app
        run: |
          cd build/DerivedData/Build/Products/Debug-iphonesimulator
          ditto -c -k --keepParent SquarePoC.app "$GITHUB_WORKSPACE/SquarePoC-simulator-app.zip"
          cd "$GITHUB_WORKSPACE"
          ls -lh SquarePoC-simulator-app.zip simulator-screenshot.png build-app.log test.log

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: squarepoc-app
          path: |
            SquarePoC-simulator-app.zip
            simulator-screenshot.png
            build-app.log
            test.log
          retention-days: 30

      - name: Publish the pre-release for this run (only this job publishes releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: poc-build-${{ github.run_number }}
          name: PoC build ${{ github.run_number }}
          prerelease: true
          body: |
            Automated build from GitHub Actions on a macOS runner.
            Contains the unsigned iOS Simulator build of SquarePoC, the Rust XCFramework ZIP, the build and test logs, the Rust logs and a simulator screenshot.
            A simulator build cannot be installed on a physical iPhone. See docs/INSTALL-ON-IPHONE.md in the repository.
          files: |
            SquarePoC-simulator-app.zip
            simulator-screenshot.png
            build-app.log
            test.log
            rust-artifacts/SquareCorePOC.xcframework.zip
            rust-artifacts/rust-poc-ios.log
            rust-artifacts/rust-poc-test.log
            rust-artifacts/upstream-native-ios-check.log

  build-device:
    name: Unsigned generic device build (validation only)
    needs: rust-ios
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Download the Rust artifact
        uses: actions/download-artifact@v4
        with:
          name: squarepoc-phase0-rust
          path: rust-artifacts

      - name: Extract the XCFramework into the location the Xcode project expects
        run: |
          set -e
          test -f rust-artifacts/SquareCorePOC.xcframework.zip
          mkdir -p SquarePoC/Frameworks
          rm -rf SquarePoC/Frameworks/SquareCorePOC.xcframework
          unzip -o rust-artifacts/SquareCorePOC.xcframework.zip -d SquarePoC/Frameworks
          FW="SquarePoC/Frameworks/SquareCorePOC.xcframework"
          test -d "$FW/ios-arm64"
          test -f "$FW/ios-arm64/libsquare_core_poc.a"
          test -f "$FW/ios-arm64/Headers/module.modulemap"
          echo "Device slice present: ios-arm64"

      - name: Build the app for a generic iOS device (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project SquarePoC.xcodeproj \
            -scheme SquarePoC \
            -configuration Debug \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DeviceDerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee device-build.log
          echo "## Unsigned device build result" >> "$GITHUB_STEP_SUMMARY"
          echo "xcodebuild generic device build exit status: ${PIPESTATUS[0]}" >> "$GITHUB_STEP_SUMMARY"

      - name: Build the test target for a generic iOS device (unsigned)
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project SquarePoC.xcodeproj \
            -scheme SquarePoC \
            -configuration Debug \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DeviceDerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee device-test-build.log

      - name: Verify the device app (arm64 binary and background audio mode)
        run: |
          set -e
          APP="build/DeviceDerivedData/Build/Products/Debug-iphoneos/SquarePoC.app"
          test -d "$APP"
          file "$APP/SquarePoC"
          file "$APP/SquarePoC" | grep -q "arm64"
          python3 - "$APP/Info.plist" <<'PY'
          import plistlib, sys
          d = plistlib.load(open(sys.argv[1], 'rb'))
          modes = d.get('UIBackgroundModes')
          assert modes and 'audio' in modes, f"UIBackgroundModes wrong: {modes}"
          print("Device app Info.plist UIBackgroundModes:", modes)
          PY
          test -d "build/DeviceDerivedData/Build/Products/Debug-iphoneos/SquarePoC.app/PlugIns/SquarePoCTests.xctest" || find build/DeviceDerivedData -name "SquarePoCTests.xctest" -maxdepth 6 | head -3
          ditto -c -k --keepParent "$APP" "$GITHUB_WORKSPACE/SquarePoC-device-unsigned-app.zip"
          ls -lh SquarePoC-device-unsigned-app.zip device-build.log device-test-build.log

      - name: Upload the unsigned device build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: squarepoc-device-unsigned
          path: |
            SquarePoC-device-unsigned-app.zip
            device-build.log
            device-test-build.log
          retention-days: 30
